<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4F46E5" />
      <stop offset="50%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#8B5CF6" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F43F5E" />
      <stop offset="100%" stopColor="#FB7185" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base App Squircle with Deep Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="white" stroke-opacity="0.25" stroke-width="1" />

  <!-- Outer Viewfinder / Crop Bracket Corners -->
  <path d="M 16 26 L 16 18 C 16 16.9 16.9 16 18 16 L 26 16" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 48 26 L 48 18 C 48 16.9 47.1 16 46 16 L 38 16" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 16 38 L 16 46 C 16 47.1 16.9 48 18 48 L 26 48" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 48 38 L 48 46 C 48 47.1 47.1 48 46 48 L 38 48" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Camera Iris & Image Diamond Prism -->
  <circle cx="32" cy="32" r="11" fill="white" fill-opacity="0.15" />
  <circle cx="32" cy="32" r="8" fill="white" />
  <circle cx="32" cy="32" r="4.5" fill="url(#bgGrad)" />

  <!-- Dynamic Cyber Glow Aperture Blades / Iris Spark -->
  <path d="M 32 18 L 35 24 L 32 23 Z" fill="url(#lensGrad)" />
  <path d="M 46 32 L 40 35 L 41 32 Z" fill="url(#lensGrad)" />
  <path d="M 32 46 L 29 40 L 32 41 Z" fill="url(#lensGrad)" />
  <path d="M 18 32 L 24 29 L 23 32 Z" fill="url(#lensGrad)" />

  <!-- Signature Top-Right Pulse Badge Dot -->
  <circle cx="47" cy="17" r="3" fill="url(#accentGrad)" />
  <circle cx="47" cy="17" r="1.5" fill="white" />
</svg>
